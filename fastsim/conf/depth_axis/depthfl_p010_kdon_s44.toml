# CIFAR-100 DepthFL (depth-heterogeneous FL + self-distillation).
# Toxic-depth setup mirroring the width toxicity config: 10% full-depth (4)
# clients, 90% shallow (depth-1) clients. acc_full = ensemble accuracy of the
# full-depth global model; acc_core = accuracy of the depth-1 exit that shallow
# clients deploy; delta_acc = acc_full - acc_core.
# Set depthfl-kd = false for the no-self-distillation ablation, and
# depthfl-extended = false for the InclusiveFL (deepest-exit-only) ablation.
num-clients = 50
num-server-rounds = 500
local-epochs = 5
clients-per-round = 5
rnd-seed = 44

learning-rate = 0.1
momentum = 0.9
weight-decay = 0.001
global-lr = 1.0

depth-levels = "4,1"
depth-distribution = "0.10,0.90"
global-depth = 4
core-depth = 1
norm-type = "bn"

depthfl-kd = true
depthfl-extended = true
kd-rampup-rounds = 300

wandb-enabled = false
save-path = "results/cifar100_depthfl_s44.csv"

compile-mode = "reduce-overhead"

[algorithm]
name = "depthfl"

[dataset]
name = "cifar100"
partitioning = "dirichlet"
alpha = 0.1
batch-size = 32
seed = 44

[model]
name = "MultiResNet18"
num-classes = 100
