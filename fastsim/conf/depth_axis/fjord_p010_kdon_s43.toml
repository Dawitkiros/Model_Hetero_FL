# CIFAR-100 FjORD (ordered dropout + self-distillation) on the FLoRE/HeteroFL
# sBN backbone, so acc_full/acc_core toxicity metrics stay comparable to
# cifar100_heterofl.toml. Set fjord-kd = false for the no-distillation ablation.
num-clients = 50
num-server-rounds = 500
local-epochs = 5
clients-per-round = 5
rnd-seed = 43

learning-rate = 0.05
momentum = 0.9
weight-decay = 0.0005
global-lr = 1.0

global-model-rate = 1.0
model-rates = "1.0,0.25"
rate-distribution = "0.10,0.90"
core-model-rate = 0.25
model-split-mode = "fix"
overlap = 0.0
norm-type = "sbn"
bn-recalibrate-eval = true
core-force-scaler-eval = true
enable-shell-repair = false

fjord-kd = true

wandb-enabled = false
save-path = "results/cifar100_fjord_s43.csv"

compile-mode = "reduce-overhead"

[algorithm]
name = "fjord"

[dataset]
name = "cifar100"
partitioning = "dirichlet"
alpha = 0.1
batch-size = 32
seed = 43

[model]
name = "HeteroPreResNet18"
num-classes = 100
