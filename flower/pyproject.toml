[tool.flwr.federations]
default = "gpu-sim-50"

# CIFAR-100 capacity-headroom probe: 50 supernodes (matches num-clients=50).
[tool.flwr.federations.gpu-sim-50]
options.num-supernodes = 50
options.backend.name = "ray"
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2
