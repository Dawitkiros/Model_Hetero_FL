# alpha-sweep phase-2 (boundary, seed 43): HeteroFL alpha=0.05 p_full=020
num-clients = 50
num-server-rounds = 300
local-epochs = 5
clients-per-round = 5
rnd-seed = 43

learning-rate = 0.05
momentum = 0.9
weight-decay = 0.0005
global-lr = 1.0

global-model-rate = 1.0
model-rates = "1.0,0.25"
rate-distribution = "0.20,0.80"
core-model-rate = 0.25
model-split-mode = "fix"
overlap = 0.0
norm-type = "sbn"
bn-recalibrate-eval = true
core-force-scaler-eval = true
enable-shell-repair = false

wandb-enabled = false
save-path = "results/alpha_sweep/heterofl_a05_p020_s43.csv"

[algorithm]
name = "heterofl"

[dataset]
name = "cifar100"
partitioning = "dirichlet"
alpha = 0.05
batch-size = 32
seed = 43

[model]
name = "HeteroPreResNet18"
num-classes = 100
